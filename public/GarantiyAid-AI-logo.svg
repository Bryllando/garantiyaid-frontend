  <circle cx="32" cy="15" r="2.5" fill="#21B894" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Friendly AI face -->
  <path d="M22 21h20a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5H29l-5.5 4v-4H22a5 5 0 0 1-5-5V26a5 5 0 0 1 5-5Z" fill="#FFFFFF"/>
